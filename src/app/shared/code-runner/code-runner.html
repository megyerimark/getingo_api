<div class="runner">
  <div class="runner-toolbar">
    <span class="runner-title">Eredmény</span>

    <div class="runner-actions">
      <button
        class="btn btn-success btn-sm"
        type="button"
        (click)="run()">
        ▶ Futtatás
      </button>

      @if (hasRun) {
        <button
          class="btn btn-outline-secondary btn-sm"
          type="button"
          (click)="clear()">
          Törlés
        </button>
      }
    </div>
  </div>

  <iframe
    #previewFrame
    class="preview-frame"
    title="Kód eredménye"
    sandbox="allow-scripts">
  </iframe>
</div>
