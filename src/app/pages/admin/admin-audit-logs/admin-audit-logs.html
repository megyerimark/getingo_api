<h1 class="mb-4">Audit log</h1>

<div class="table-responsive">
  <table class="table table-hover bg-white">
    <thead>
      <tr>
        <th>Dátum</th>
        <th>Admin ID</th>
        <th>Művelet</th>
        <th>Típus</th>
        <th>Cél ID</th>
        <th>Adatok</th>
      </tr>
    </thead>

    <tbody>
      @for (log of logs; track log.id) {
        <tr>
          <td>{{ log.created_at | date:'yyyy.MM.dd HH:mm' }}</td>
          <td>{{ log.actor_user_id ?? '-' }}</td>
          <td>{{ log.action }}</td>
          <td>{{ log.target_type ?? '-' }}</td>
          <td>{{ log.target_id ?? '-' }}</td>
          <td><pre>{{ log.metadata | json }}</pre></td>
        </tr>
      }
    </tbody>
  </table>
</div>
